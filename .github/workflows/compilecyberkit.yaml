name: Compile CyberKit for iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: main
        submodules: 'recursive'

    - name: Select the correct Xcode tool
      run: |
        sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Instal required dependencies & Theos
      run: |
        export THEOS=/Users/runner/theos
        bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        echo "THEOS=$THEOS" >> $GITHUB_ENV

        cd /Users/runner/work/CyberKit/CyberKit
        git clone https://github.com/theos/sdks theos_sdks
        cp -r theos_sdks/iPhoneOS15.6.sdk $THEOS/sdks/

    - name: Inyect xpc.h private header
      run: |
        mkdir -p /Users/runner/theos/sdks/iPhoneOS15.6.sdk/usr/include/xpc
        curl -fsSL https://github.com/theos/templates/blob/f0fb942c4bb90ef331126e2b38257974b18bc895/ios/xpc_service/headers/xpc/xpc.h \
             -o /Users/runner/theos/sdks/iPhoneOS15.6.sdk/usr/include/xpc/xpc.h

    - name: Configure Xcode for Embbeded  Development
      run: |
        chmod +x Tools/Scripts/configure-xcode-for-embedded-development
        python ./Tools/Scripts/configure-xcode-for-embedded-development

    - name: Compile (arm64)
      env:
        ARCHS: "arm64"
        VALID_ARCHS: "arm64"
        CURRENT_ARCH: "arm64"

      run: |
        xcodebuild -project Source/WebKit/WebKit.xcodeproj \
                   -scheme WebKit \
                   -configuration Release \
                   -sdk iphoneos \
                   ARCHS="arm64" \
                   DEPLOYMENT_TARGET=15.0 \
                   ONLY_ACTIVE_ARCH=NO \
                   -derivedDataPath ios15_arm64_build

    - name: Up the compiled binary
      uses: actions/upload-artifact@v4
      with:
        name: CyberKit-WebKit-iOS15-arm64
        path: ios15_arm64_build/Build/Products/Release-iphoneos/
